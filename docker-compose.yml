services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: expense-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"   # phải khớp db.properties
      MSSQL_PID: Developer
      TZ: Asia/Ho_Chi_Minh                         # để GETDATE()/SYSDATETIME() trả giờ Việt Nam thay vì UTC
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql            # dữ liệu nằm ở volume, tắt container không mất
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  sqlserver-data:
